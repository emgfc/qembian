# Nokia N79 (RM-348) keys -> EStdKey scan codes -> host keys.
# Scan codes: the N79's keypad_exp.dll 32-bit matrix table at 0x8010b710 (RM-348 30.019) [V]; matrix
# indexes in the comments. Power is not in the matrix (power-key path, as on the N95/5730) [I].
# Entries and host keys follow the N95 keymap (same ITU-T keypad layout); the N79 has no Edit, Gallery
# or media keys. EStdKeyDeviceF (matrix 89) is a key the N95 does not have [I: which one].
schema = 1
device = "nokia-n79-rm348"

[aliases]
select = "ok"
back = "rsk"

[[keys]]
key = "lsk"
label = "LSK"
scancode = "EStdKeyDevice0"
host = ["f5"]
set1 = 0x3f
group = "front"
row = 0
col = 0   # matrix 13

[[keys]]
key = "ok"
label = "OK"
scancode = "EStdKeyDevice3"
host = ["f6", "ret"]
set1 = 0x40
group = "nav"
row = 1
col = 1   # matrix 76

[[keys]]
key = "rsk"
label = "RSK"
scancode = "EStdKeyDevice1"
host = ["f7"]
set1 = 0x41
group = "front"
row = 0
col = 2   # matrix 14

[[keys]]
key = "menu"
label = "Menu"
scancode = "EStdKeyApplication0"
host = ["f8"]
set1 = 0x42
group = "front"
row = 1
col = 0   # matrix 26

[[keys]]
