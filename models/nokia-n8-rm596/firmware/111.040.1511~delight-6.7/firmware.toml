# Nokia N8 (RM-596) with Delight 6.7, a custom firmware on Belle Refresh 111.040.1511 (the owner's real
# N8 runs it). Modified core image (164 MB vs stock 131 MB) with the stock Euro_2 language pack and the
# Germany customer variant. Extends the stock Belle Refresh profile (personality sym101); here only what
# belongs to this firmware (files, identity, addresses).
extends = "111.040.1511"                 # another firmware of this model

[device]
id = "nokia-n8-rm596-delight"
model = "N8 (Delight 6.7 on Belle Refresh)"
aliases = []
notes = "Custom firmware Delight 6.7 (core modified), Euro_2 rofs2 02.01, Germany rofs3 C14.01; the owner's phone."

[firmware]
store = "RM-596/111.040.1511~delight-6.7"                   # the ROM store entry (custom firmware of a stock version: tools/fw/store.py)
version = "111.040.1511-delight-6.7"
obtain = """
The Delight 6.7 package for RM-596 (core, Euro_2 rofs2 02.01, C14.01 rofs3). Put the files in
roms/RM-596/111.040.1511~delight-6.7/ (git-ignored).
"""

[[firmware.files]]
role = "core"
glob = "RM-596_111.040.1511_79u_prd.core.fpsx"

[[firmware.files]]
role = "rofs2"
glob = "RM-596_111.040.1511_02.01_Euro_2_*_prd.rofs2.fpsx"

[[firmware.files]]
role = "rofs3"
glob = "RM-596_111.040.1511_C14.01_*_prd.rofs3.fpsx"

[firmware.identity]
sw = { version = "111.040.1511", date = "2012-08-27", type_code = "RM-596" }   # Resource/versions/sw.txt [V] (stock Belle Refresh: 2012-07-28)

[rom]
# no H-startuptone-none: Delight keeps CenRep 101F8763 as a compiled .cre in ROFS1 and its start-up tone is
# C:\Data\Animations\Startup.aac, a user file absent on a fresh C:, so no tone is played to wait for
rofs_patches = []

# Delight's ROFS1 carries its own kernel drivers for the real phone. On the composite Z: a ROFS file
# shadows the core image, so its sys/bin/lightpdd.pdd replaced our LightPdd stand-in and the lights
# service left -5 (lightsaserver, system-permanent: kernel fault 102). Point that entry at our stand-in.
# (Lists of unnamed tables replace the parent's, so the H-khr entries are repeated.)
[[rom.rofs_replace]]
image = 1
path = "sys/bin/lightpdd.pdd"
standin = "lightpdd.pdd"
hack = "H-delight-own-drivers"

[[rom.rofs_replace]]
image = 1
path = "sys/bin/libEGL.dll"
built = "khr/libEGL.dll"
hack = "H-khr"

[[rom.rofs_replace]]
image = 1
path = "sys/bin/libOpenVG.dll"
built = "khr/libOpenVG.dll"
hack = "H-khr"

[[rom.rofs_replace]]
image = 1
path = "sys/bin/libOpenVGU.dll"
built = "khr/libOpenVGU.dll"
hack = "H-khr"

[[rom.rofs_replace]]
image = 1
path = "sys/bin/libGLES_CM.dll"
built = "khr/libGLES_CM.dll"
hack = "H-khr"

[[rom.rofs_replace]]
image = 1
path = "sys/bin/libGLESv1_CM.dll"
built = "khr/libGLESv1_CM.dll"
hack = "H-khr"

[[rom.rofs_replace]]
image = 1
path = "sys/bin/libGLESv2.dll"
built = "khr/libGLESv2.dll"
hack = "H-khr"

# N8 Belle start-up (docs/devices/nokia-n8-rm596/belle-emergency-only.md): sastartupservice raises "SIM not ready"
# besides "SIM removed" when it first sees status 06 in global state 103 (security check), and that late event turned
# KPSSimStatus 104 into 103 -> EmergencyCallsOnly (105). Seen in any earlier state it raises once and sets its done flag
# (0x80e711a6) [V]. A real modem reports "no SIM" when its SIM server starts, right after SAServer subscribes, not
# after the security check's query: send SIM_IND {05 06} on channel 35 at subscription.
[modem]
indications = [{ res = 0x09, msg = 0xEF, data = "05 06", channel = 35 }]
# SIM_STATUS service 01 (SIM lock): the real modem answers {01 24} with no SIM [V real N8 Delight, phonet 2026-11-11], but with
# 0x24 our start-up stops at the security check (sastartupservice takes its retry path, 0x80e71aa8) [V]; the family
# value 01 (lock OK) passes. Open: what else the real SIM server sends that makes 0x24 work.
