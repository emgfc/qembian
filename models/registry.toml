# Known Nokia type codes (docs/device-model-v2.md 2.1): grows with our knowledge. A row needs no profile;
# it lets ROM identification say "known phone, no emulation profile yet" instead of "unknown".
#   code      type designator (sw.txt / .vpl TypeDesignator)
#   name      marketing name;  platform: S60/Symbian release;  soc: adaptation family ([I] = not checked)
#   model     emulation profile id (models/<id>/), "" = none;  base: for a variant, the model it extends
#   status    supported (a profile boots) | profile-draft | known (firmware held or targeted, no profile)
# Seeded 2026-11-10 from docs/device-matrix.md sections 2-3 and the firmware held in roms/.
schema = 1
default = "nokia-n95-8gb-rm320"         # the device a bare tools/device.py, sydb or script uses when no SYBORG_DEVICE / instance names one

