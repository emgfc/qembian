# Firmware 113.010.1506 of nokia-701-rm774 (device model v2: merged over models/nokia-701-rm774/model.toml). What belongs to this
# firmware build: its files, identity and addresses. The model is the phone.

[firmware]
version = "113.010.1506"
obtain = """
Flash files of RM-774 113.010.1506 (Belle FP2): prd.core.fpsx, the Euro_1 language pack 01.01, the generic
customer variant C00.01 and the U01.01 user data. Put them in roms/RM-774/113.010.1506/ (git-ignored).
"""
[[firmware.files]]
role = "core"                              # SOS+CORE + SOS+ROFS1 [V partition names]
glob = "RM-774_113.010.1506_79u_prd.core.fpsx"

[[firmware.files]]
role = "rofs2"                             # language pack
glob = "RM-774_*_01.01_Euro_1_*_prd.rofs2.fpsx"

[[firmware.files]]
role = "rofs3"                             # customer variant
glob = "RM-774_*_C00.01_*_prd.rofs3.fpsx"   # generic customer variant

[firmware.identity]                         # filled from the inventory
sw = { version = "113.010.1506", date = "2012-08-30", type_code = "RM-774" }   # Resource/versions/sw.txt [V]
langsw = {}
drivers = []

[firmware.rom]
user_window_start = 0x804C5300             # EDISP.DLL (probe.py header) [V]
# User data layer: the C: drive the flasher writes after the ROM layers (factory content: installed apps,
# Starter list, media). New session drives start as a copy (docs/devices.md "User data layer").
[[firmware.files]]
role = "uda"
glob = "RM-774_*_U01.01_*.uda.fpsx"
drive = "C"
optional = true
