# The Syborg baseport keyboard table as shipped (external/qemu-syborg baseport syborg_keyboard.h):
# PC set-1 code (E0-prefixed = bit 7) -> EStdKey name or character literal. Device keymaps
# (models/<id>/keymap.toml set1 entries) are laid over it by tools/device.py gen keymap-header.
[slots]
"01" = "EStdKeyEscape"
"02" = "'1'"
"03" = "'2'"
"04" = "'3'"
"05" = "'4'"
"06" = "'5'"
"07" = "'6'"
"08" = "'7'"
"09" = "'8'"
"0a" = "'9'"
"0b" = "'0'"
"0c" = "EStdKeyMinus"
"0d" = "EStdKeyEquals"
"0e" = "EStdKeyBackspace"
"0f" = "EStdKeyTab"
"10" = "'Q'"
"11" = "'W'"
"12" = "'E'"
"13" = "'R'"
"14" = "'T'"
"15" = "'Y'"
"16" = "'U'"
"17" = "'I'"
"18" = "'O'"
"19" = "'P'"
"1a" = "EStdKeySquareBracketLeft"
"1b" = "EStdKeySquareBracketRight"
"1c" = "EStdKeyEnter"
"1d" = "EStdKeyLeftCtrl"
"1e" = "'A'"
"1f" = "'S'"
"20" = "'D'"
"21" = "'F'"
"22" = "'G'"
"23" = "'H'"
"24" = "'J'"
"25" = "'K'"
"26" = "'L'"
"27" = "EStdKeySemiColon"
"28" = "EStdKeySingleQuote"
"2a" = "EStdKeyLeftShift"
"2b" = "EStdKeyHash"
"2c" = "'Z'"
"2d" = "'X'"
"2e" = "'C'"
"2f" = "'V'"
"30" = "'B'"
"31" = "'N'"
"32" = "'M'"
"33" = "EStdKeyComma"
"34" = "EStdKeyFullStop"
"35" = "EStdKeyForwardSlash"
"36" = "EStdKeyRightShift"
"37" = "EStdKeyPrintScreen"
"38" = "EStdKeyLeftAlt"
"39" = "EStdKeySpace"
"3a" = "EStdKeyCapsLock"
"3b" = "EStdKeyMenu"
"3c" = "EStdKeyF2"
"3d" = "EStdKeyF3"
"3e" = "EStdKeyF4"
"3f" = "EStdKeyDevice0"
"40" = "EStdKeyDevice3"
"41" = "EStdKeyDevice1"
"42" = "EStdKeyApplication0"
"43" = "EStdKeyF9"
"44" = "EStdKeyF10"
"46" = "EStdKeyScrollLock"
"47" = "EStdKeyHome"
"48" = "EStdKeyUpArrow"
"49" = "EStdKeyPageUp"
"4b" = "EStdKeyLeftArrow"
"4d" = "EStdKeyRightArrow"
"4f" = "EStdKeyEnd"
"50" = "EStdKeyDownArrow"
"51" = "EStdKeyPageDown"
"52" = "EStdKeyInsert"
"53" = "EStdKeyDelete"
"56" = "EStdKeyBackSlash"
"57" = "EStdKeyF11"
"58" = "EStdKeyF12"

# patch qemu-baseport 0005 (extended navigation): E0-prefixed PC keys, folded into bit 7
"9c" = "EStdKeyEnter"
"9d" = "EStdKeyRightCtrl"
"b5" = "EStdKeyForwardSlash"
"b8" = "EStdKeyRightAlt"
"c7" = "EStdKeyHome"
"c8" = "EStdKeyUpArrow"
"c9" = "EStdKeyPageUp"
"cb" = "EStdKeyLeftArrow"
"cd" = "EStdKeyRightArrow"
"cf" = "EStdKeyEnd"
"d0" = "EStdKeyDownArrow"
"d1" = "EStdKeyPageDown"
"d2" = "EStdKeyInsert"
"d3" = "EStdKeyDelete"
