# Nokia 5730 XpressMusic (RM-465) keys -> EStdKey scan codes -> host keys.
# Scan codes: the 5730's keypad_exp.dll 32-bit matrix table at 0x8010ba3c (RM-465 v101.48.128) [V];
# index numbers in the comments. End and Power are not in the matrix (power-key path) [I].
# QWERTY slide: letters on the host letter keys (digits keep the numeric keypad).
schema = 1
device = "nokia-5730-rm465"

[aliases]
select = "ok"
back = "rsk"

[[keys]]
key = "lsk"
label = "LSK"
scancode = "EStdKeyDevice0"
host = ["f5"]
set1 = 0x3f
group = "front"
row = 0
col = 0   # matrix 81

[[keys]]
key = "rsk"
label = "RSK"
scancode = "EStdKeyDevice1"
host = ["f7"]
set1 = 0x41
group = "front"
row = 0
col = 2   # matrix 94

[[keys]]
key = "menu"
label = "Menu"
scancode = "EStdKeyApplication0"
host = ["f8"]
set1 = 0x42
group = "front"
row = 1
col = 0   # matrix 83

[[keys]]
key = "call"
label = "Call"
scancode = "EStdKeyYes"
host = ["f2"]
set1 = 0x3c
group = "front"
row = 2
col = 0   # matrix 96

[[keys]]
key = "end"
label = "End"
scancode = "EStdKeyNo"
host = ["f3"]
set1 = 0x3d
group = "front"
row = 2
col = 2
evidence = "I"   # not in the matrix (power-key path) [I]

[[keys]]
key = "clear"
label = "C"
scancode = "EStdKeyBackspace"
host = ["backspace"]
set1 = 0x0e
group = "front"
row = 1
col = 2   # matrix 82

[[keys]]
key = "ok"
label = "OK"
scancode = "EStdKeyDevice3"
host = ["f6", "ret"]
set1 = 0x40
group = "nav"
row = 1
col = 1   # matrix 64

[[keys]]
