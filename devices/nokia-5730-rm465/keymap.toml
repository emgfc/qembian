# QWERTY slide: wsini.ini hardware states EKeyDeviceB = 240x320 at 0, EKeyDeviceA = 320x240 at 90,
# EKeyDeviceC = 320x240 at 270 [V]; sent as keys until a switch stand-in exists.
[[switches]]
name = "qwerty-slide"
positions = ["closed", "open"]
open  = { scancode = "EStdKeyDeviceA", host = ["f13"], set1 = 0x5d, layout = "landscape" }
close = { scancode = "EStdKeyDeviceB", host = ["f14"], set1 = 0x5e, layout = "portrait" }
