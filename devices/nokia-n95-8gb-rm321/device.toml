# Nokia N95 8GB China variant (RM-321): same hardware without WLAN [I: type code from Nokia's
# variant list, not checked against a firmware]. Shows how a variant inherits: every table of the
# base profile is deep-merged, scalars and arrays here replace the base's, `remove` lists drop
# entries of a base array-of-tables by `name`.
schema = 1
extends = "nokia-n95-8gb-rm320"

[device]
id = "nokia-n95-8gb-rm321"
model = "N95 8GB (China)"
type_code = "RM-321"
market = "china"
aliases = []

[firmware]
version = ""                                 # fill from the RM-321 flash files; tools/fw inventory writes firmware.sha256
[[firmware.files]]
role = "core"
glob = "RM-321_*.C0R"
partitions = { core = "SOS_CORE", rofs = "SOS_ROFS" }
[[firmware.files]]
role = "rofx"
glob = "RM-321_*.v1?"
partitions = { rofs = "SOS_ROFX" }
optional = true

# ---------------------------------------------------------------------------------------------
[hardware]
wlan = false

[firmware.identity]                          # fill from the RM-321 firmware (tools/device.py identify DIR)
sw = { version = "", date = "", type_code = "RM-321" }
langsw = {}
drivers = []
no_drivers = ["wlanldd.ldd", "wlanpdd.pdd"]  # the China variant has no WLAN
[firmware.identity.sha256]
"core-flat.img" = ""
"rofs1.img" = ""
"rofs2.img" = ""

# The ROM differs, so every address-bearing input is per variant: byte patches, GL entry patches
# and the blob gap must be regenerated from this ROM (tools/device.py gen --device nokia-n95-8gb-rm321).
[rom]
code_patches = ["code-patches.txt"]          # re-locate the three N95 hacks in this ROM (same functions, other addresses)
[gl]
entry_patches = "gl/gles-patches.txt"
imports = "gl/n95imports.txt"                # addresses resolve from this variant's symindex at build time

[status]
level = "L0-none"
updated = ""
open = ["everything: no firmware inventoried yet"]
